<div class="flex justify-between h-full px-4 sm:px-6 lg:px-8">
  <div class="w-full max-w-4xl rounded-lg shadow-xl overflow-hidden">
    <div class="bg-white">
      <div class="p-0">
        <div class="overflow-y-auto max-h-96 md:max-h-[500px]">
          @if (commentsIsLoading()) {
            Loading ...
          } @else {
            <ul class="divide-y divide-gray-200">
              @for (c of comments();track c.id) {
                <li class="p-4 md:p-6 hover:bg-gray-50 transition-colors">
                  <div class="flex items-start space-x-3 md:space-x-4">
                    <div class="flex-shrink-0">
                      <img
                        class="w-10 h-10 md:w-12 md:h-12 rounded-full object-cover"
                        src="https://bootdey.com/img/Content/user_1.jpg"
                        alt="Photo de profil">
                    </div>

                    <div class="flex-1 min-w-0">
                      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between mb-2 gap-2">
                        <strong class="text-blue-600 font-semibold text-sm sm:text-base">
                          {{c.user.username}}
                        </strong>
                        <span class="text-xs sm:text-sm text-gray-500">
                        {{c.likes}} Likes
                      </span>
                      </div>

                      <strong class="text-gray-900 block mb-1 text-sm sm:text-base">
                        {{c.user.fullName}}
                      </strong>

                      <p class="text-xs sm:text-sm text-gray-600 leading-relaxed">
                        {{c.body}}
                      </p>
                    </div>
                  </div>
                </li>
              }
            </ul>
          }
        </div>
      </div>
    </div>
  </div>
  <div class="rounded">
    <span>Selection des likes : </span>
    <select [(ngModel)]="selectedCommentsId" (ngModelChange)="onSelectionChange()" >
      @for (like of likes();track like) {
        <option [value]="like">{{like}}</option>
      }
    </select>

  </div>
</div>
